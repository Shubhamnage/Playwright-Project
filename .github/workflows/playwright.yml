
name: Playwright Automation Tests

on:
  push:
    branches:
      - Dev2

  pull_request:
    branches:
      - Dev2

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Playwright Tests - ${{ matrix.project }}
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - Chrome
          - Edge

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install browsers and OS dependencies
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chrome msedge

      # 5. Execute all test cases
      - name: Run all Playwright tests
        run: |
          npx playwright test \
            --project="${{ matrix.project }}" \
            --workers=4
        env:
          CI: "true"

      # 6. Upload HTML report
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      # 7. Upload traces, screenshots and videos
      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
