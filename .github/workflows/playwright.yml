
name: Playwright Tests

on:
  push:
    branches:
      - Dev2

  pull_request:
    branches:
      - Dev2

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Playwright Tests - ${{ matrix.project }}
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - Chrome
          - Edge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chrome msedge

      - name: Run widgets.spec.ts in ${{ matrix.project }}
        run: npx playwright test tests/practice/widgets.spec.ts --project="${{ matrix.project }}" --workers=4
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
