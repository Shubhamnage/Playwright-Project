
name: Playwright Automation Tests - NodeJS

on:
  push:
    branches:
      - Dev2

  pull_request:
    branches:
      - Dev2

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Playwright Tests - Chrome
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Verify Node.js and npm
      - name: Verify Node.js and npm
        run: |
          node --version
          npm --version

      # 4. Install project dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Install Chrome browser with OS dependencies
      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome

      # 6. Execute Playwright tests only in Chrome
      - name: Run Playwright Tests - Chrome
        run: npx playwright test --project="Chrome" --workers=4
        env:
          CI: "true"

      # 7. Upload HTML report
      - name: Upload Playwright HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-chrome
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      # 8. Upload screenshots, videos and traces
      - name: Upload Playwright Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-chrome
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
