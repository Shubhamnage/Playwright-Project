
name: "Copilot Setup Steps - Playwright Execution"

on:
  workflow_dispatch:

  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    name: Execute Playwright Test Cases
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project:
          - Chrome
          - Edge

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chrome msedge

      # 5. Verify Playwright installation
      - name: Verify Playwright version
        run: npx playwright --version

      # 6. Discover generated test cases
      - name: List Playwright test cases
        run: npx playwright test --project="${{ matrix.project }}" --list

      # 7. Execute all generated Playwright test cases
      - name: Execute Playwright tests - ${{ matrix.project }}
        run: npx playwright test --project="${{ matrix.project }}" --workers=4
        env:
          CI: "true"

      # 8. Upload HTML report
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      # 9. Upload screenshots, videos and traces
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
